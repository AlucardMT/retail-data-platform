  expect:
    format: sql
    rows: SELECT 1 AS event_id, 'duplicate01' AS event_uuid, 'test_duplicate' AS customer_unique_id, 'test_duplicate_profile' AS customer_id, 'I' AS operation, TIMESTAMP '2026-01-01 10:00:00+00' AS event_timestamp, TIMESTAMP '2026-01-01 10:00:00+00' AS recorded_at, 1 AS schema_version, TIMESTAMP '2026-01-02 10:00:00+00' AS ingested_at, CAST(NULL AS STRING) AS before_customer_city, CAST(NULL AS STRING) AS before_customer_state, CAST(NULL AS STRING) AS before_customer_zip_code_prefix, 'cajamar' AS after_customer_city, 'SP' AS after_customer_state, '07787' AS after_customer_zip_code_prefix, CAST(NULL AS JSON) AS before_json, PARSE_JSON('{"customer_city":"cajamar","customer_state":"SP","customer_zip_code_prefix":"07787"}') AS after_json
