- name: unit_staging_duplicate_uuid
  model: stg_customer_cdc_events
  given:
  - input: source('bronze', 'customer_cdc_events')
    format: sql
    rows: 'SELECT 1 AS event_id, ''duplicate01'' AS event_uuid, ''test_duplicate'' AS customer_unique_id, ''test_duplicate_profile'' AS customer_id, ''I'' AS operation, TIMESTAMP ''2026-01-01 10:00:00+00'' AS event_timestamp, TIMESTAMP ''2026-01-01 10:00:00+00'' AS recorded_at, CAST(NULL AS JSON) AS before_data, PARSE_JSON(''{"customer_city":"cajamar","customer_state":"SP","customer_zip_code_prefix":"07787"}'') AS after_data, 1 AS schema_version, TIMESTAMP ''2026-01-01 10:00:00+00'' AS ingested_at

